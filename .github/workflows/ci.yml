name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [devel, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_NAME: finance
      DATABASE_USER: finance
      DATABASE_PASSWORD: finance
      DATABASE_HOST: localhost
      CONFIG_PATH: ${{ github.workspace }}/config.example.toml
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.dev.txt
      - run: pytest --cov=main --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24.21.0
          package-json-file: 'frontend/package.json'
          install: false
          cache: true
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      - run: pnpm install
        id: install
      - run: pnpm lint
      - run: pnpm next typegen
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm tsc --noEmit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm vitest run
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
